name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build release APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publish release if version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(cat version.txt | tr -d '[:space:]')
          cp app/build/outputs/apk/release/app-release.apk EngineersDesk-$V.apk
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V exists — uploading rebuilt APK"
            gh release upload "v$V" EngineersDesk-$V.apk --clobber
          else
            gh release create "v$V" EngineersDesk-$V.apk --title "Engineer's Desk $V" --notes-file WHATSNEW.md
          fi
